<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Tracker 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TuitionTracker">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Tuition%20Attendance%20Tracker%22,%22short_name%22:%22Tuition%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f8fafc%22,%22theme_color%22:%22%233b82f6%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3589/3589030.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22,%22purpose%22:%22any%20maskable%22}]}">

    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-cell {
            min-height: 75px; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; cursor: pointer; border-radius: 12px;
            font-size: 0.875rem; transition: all 0.2s; padding: 6px; border: 2px solid transparent;
        }
        .day-inactive { @apply bg-white text-gray-300 border-gray-50; }
        .day-active { @apply bg-white border-blue-50 shadow-sm; }
        .indicator {
            width: 20px; height: 20px; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 10px;
            font-weight: bold; color: white; flex-shrink: 0;
        }
        .student-item { @apply flex items-center justify-between p-3 rounded-2xl bg-slate-50 border-2 border-transparent cursor-pointer transition-all hover:bg-slate-100; }
        .student-active { @apply border-blue-500 bg-blue-50 shadow-md scale-[1.02]; }
        .day-label { @apply text-[10px] font-black text-gray-400 text-center py-2 uppercase tracking-widest; }
        .card { @apply bg-white rounded-3xl shadow-xl border border-gray-100 p-6; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Tuition Manager <span class="text-blue-600">2026</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <p id="status" class="text-green-600 text-[10px] font-bold uppercase tracking-widest">● All Data Saved</p>
                    <span class="text-slate-300 text-[10px]">|</span>
                    <button onclick="analyzeAllWithGemini()" class="text-blue-600 text-[10px] font-bold uppercase tracking-widest hover:underline">✨ Monthly Insights</button>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-white p-2 px-4 rounded-2xl shadow-sm border border-gray-100">
                <select id="monthSelect" onchange="renderApp()" class="bg-transparent font-bold text-slate-700 outline-none cursor-pointer">
                    <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                    <option value="3">April</option><option value="4" selected>May</option><option value="5">June</option>
                    <option value="6">July</option><option value="7">August</option><option value="8">September</option>
                    <option value="9">October</option><option value="10">November</option><option value="11">December</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="card">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg">Students</h2>
                        <div class="flex gap-2">
                            <button onclick="handleDelete()" class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200 transition-all">🗑</button>
                            <button onclick="handleAdd()" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 shadow-lg font-bold text-xl">+</button>
                        </div>
                    </div>
                    <div id="studentList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
                </div>

                <!-- AI Tools Panel -->
                <div id="aiControls" class="card hidden border-blue-100 bg-blue-50/30">
                    <h3 class="font-bold text-sm text-blue-800 mb-3">✨ Student AI Tools</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="generateGeminiReport()" class="bg-white border border-blue-200 p-3 rounded-xl text-[10px] font-bold text-blue-700 hover:bg-blue-100">REPORT</button>
                        <button onclick="generateLessonPlan()" class="bg-white border border-blue-200 p-3 rounded-xl text-[10px] font-bold text-blue-700 hover:bg-blue-100">PLANNER</button>
                        <button onclick="draftReminder()" class="bg-white border border-blue-200 p-3 rounded-xl text-[10px] font-bold text-blue-700 hover:bg-blue-100 col-span-2">PARENT REMINDER</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="card">
                    <div class="calendar-grid mb-2">
                        <div class="day-label">Sun</div><div class="day-label">Mon</div><div class="day-label">Tue</div><div class="day-label">Wed</div><div class="day-label">Thu</div><div class="day-label">Fri</div><div class="day-label">Sat</div>
                    </div>
                    <div id="calendar" class="calendar-grid"></div>
                </div>
                
                <div class="mt-6 flex gap-4">
                    <button onclick="window.print()" class="flex-grow py-3 bg-slate-800 text-white rounded-2xl text-sm font-bold hover:bg-slate-900 shadow-lg">Export PDF</button>
                    <button onclick="handleReset()" class="px-6 py-3 bg-white border border-gray-200 text-red-500 rounded-2xl text-sm font-bold hover:bg-red-50 transition-all">Clear Month</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Modal -->
    <div id="aiModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold text-slate-900">AI Insights</h3>
                <button onclick="closeModal()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div id="modalLoading" class="flex flex-col items-center justify-center py-12 hidden">
                <div class="loader mb-4"></div>
                <p class="text-slate-500 text-sm">Thinking...</p>
            </div>
            <div id="modalContent" class="overflow-y-auto text-slate-600 text-sm leading-relaxed whitespace-pre-wrap flex-grow pr-2"></div>
            <div class="mt-6 pt-4 border-t flex gap-2">
                <button onclick="copyModalContent()" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold">COPY</button>
                <button onclick="closeModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 

        // Register Service Worker with error handling for blob URLs in specific environments
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                const sw = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
                const blob = new Blob([sw], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl).catch(err => {
                    console.log('Service Worker registration skipped or failed:', err.message);
                });
            });
        }

        // CORE STATE
        let students = JSON.parse(localStorage.getItem('tuition_students')) || [{ id: 's1', name: 'Student A', color: '#3b82f6', initial: 'A' }];
        let selectedStudentId = students.length > 0 ? students[0].id : null;
        let attendanceData = JSON.parse(localStorage.getItem('tuition_attendance')) || {};
        const colors = ['#3b82f6', '#a855f7', '#ec4899', '#f59e0b', '#10b981', '#ef4444', '#06b6d4'];

        async function callGemini(prompt) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received from AI.";
            } catch (e) {
                return "Error connecting to AI service. Please check your connection.";
            }
        }

        async function analyzeAllWithGemini() {
            const m = document.getElementById('monthSelect').value;
            const summary = students.map(s => `${s.name}: ${getAttendanceCount(s.id, m)} days`).join(', ');
            openModal("Insights");
            const result = await callGemini(`Summarize attendance: ${summary}. Who is consistent and who needs help?`);
            showResult(result);
        }

        async function generateGeminiReport() {
            const s = students.find(x => x.id === selectedStudentId);
            const m = document.getElementById('monthSelect').value;
            openModal(`${s.name}'s Report`);
            const result = await callGemini(`Write a report for ${s.name} who attended ${getAttendanceCount(s.id, m)} times this month.`);
            showResult(result);
        }

        async function generateLessonPlan() {
            const s = students.find(x => x.id === selectedStudentId);
            openModal("Lesson Plan");
            const result = await callGemini(`Generate a 4-week tuition plan for ${s.name}.`);
            showResult(result);
        }

        async function draftReminder() {
            const s = students.find(x => x.id === selectedStudentId);
            openModal("Reminder");
            const result = await callGemini(`Draft a polite WhatsApp reminder for ${s.name}'s parents regarding tuition sessions.`);
            showResult(result);
        }

        function getAttendanceCount(sid, m) {
            let c = 0; if (attendanceData[m]) Object.values(attendanceData[m]).forEach(l => { if (l.includes(sid)) c++; });
            return c;
        }

        function saveData() {
            localStorage.setItem('tuition_students', JSON.stringify(students));
            localStorage.setItem('tuition_attendance', JSON.stringify(attendanceData));
            document.getElementById('status').innerText = "● Saving...";
            setTimeout(() => document.getElementById('status').innerText = "● All Data Saved", 500);
        }

        function handleAdd() {
            const n = prompt("Student Name:");
            if (n && n.trim()) {
                const id = 's' + Date.now();
                students.push({ id, name: n.trim(), color: colors[students.length % colors.length], initial: n.trim().charAt(0).toUpperCase() });
                selectedStudentId = id; saveData(); renderApp();
            }
        }

        function handleDelete() {
            if (students.length === 0) return;
            const choice = prompt(students.map((s, i) => `${i + 1}. ${s.name}`).join('\n') + "\n\nEnter number to delete:");
            const idx = parseInt(choice) - 1;
            if (students[idx] && confirm("Delete student?")) {
                students.splice(idx, 1);
                selectedStudentId = students[0]?.id || null;
                saveData(); renderApp();
            }
        }

        function handleRename(id) {
            const s = students.find(x => x.id === id);
            const n = prompt("New Name:", s.name);
            if (n && n.trim()) { s.name = n.trim(); s.initial = s.name.charAt(0).toUpperCase(); saveData(); renderApp(); }
        }

        function renderStudentList() {
            const container = document.getElementById('studentList'); container.innerHTML = '';
            const m = document.getElementById('monthSelect').value;
            document.getElementById('aiControls').classList.toggle('hidden', !selectedStudentId);
            students.forEach(s => {
                const isActive = selectedStudentId === s.id;
                const div = document.createElement('div');
                div.className = `student-item ${isActive ? 'student-active' : ''}`;
                div.onclick = () => { selectedStudentId = s.id; renderApp(); };
                div.innerHTML = `<div class="flex items-center gap-3"><div class="indicator" style="background-color:${s.color}">${s.initial}</div><div><p class="text-sm font-bold text-slate-700">${s.name}</p><p class="text-[10px] font-bold ${isActive ? 'text-blue-600' : 'text-slate-400'} uppercase">${getAttendanceCount(s.id, m)} Sessions</p></div></div><button class="edit-btn p-2 text-slate-300">📝</button>`;
                div.querySelector('.edit-btn').onclick = (e) => { e.stopPropagation(); handleRename(s.id); };
                container.appendChild(div);
            });
        }

        function renderCalendar() {
            const container = document.getElementById('calendar'); container.innerHTML = '';
            const m = parseInt(document.getElementById('monthSelect').value);
            const first = new Date(2026, m, 1).getDay();
            const total = new Date(2026, m + 1, 0).getDate();
            for (let i = 0; i < first; i++) container.appendChild(document.createElement('div'));
            for (let d = 1; d <= total; d++) {
                const dData = (attendanceData[m] && attendanceData[m][d]) || [];
                const el = document.createElement('div');
                el.className = `day-cell border ${dData.length > 0 ? 'day-active' : 'day-inactive'}`;
                el.innerHTML = `<span class="font-bold mb-1">${d}</span><div class="flex flex-wrap gap-1">${dData.map(sid => {
                    const s = students.find(st => st.id === sid);
                    return s ? `<div class="indicator" style="background-color:${s.color}">${s.initial}</div>` : '';
                }).join('')}</div>`;
                el.onclick = () => {
                    if (!selectedStudentId) return;
                    if (!attendanceData[m]) attendanceData[m] = {};
                    if (!attendanceData[m][d]) attendanceData[m][d] = [];
                    const idx = attendanceData[m][d].indexOf(selectedStudentId);
                    if (idx > -1) attendanceData[m][d].splice(idx, 1); else attendanceData[m][d].push(selectedStudentId);
                    saveData(); renderApp();
                };
                container.appendChild(el);
            }
        }

        function openModal(t) { 
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('modalContent').innerText = "";
            document.getElementById('modalLoading').classList.remove('hidden');
            document.getElementById('aiModal').classList.remove('hidden');
        }
        function showResult(t) {
            document.getElementById('modalLoading').classList.add('hidden');
            document.getElementById('modalContent').innerText = t;
        }
        function closeModal() { document.getElementById('aiModal').classList.add('hidden'); }
        function copyModalContent() {
            const text = document.getElementById('modalContent').innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Copied to clipboard!");
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }
        function handleReset() { if (confirm("Clear month?")) { attendanceData[document.getElementById('monthSelect').value] = {}; saveData(); renderApp(); } }
        function renderApp() { renderStudentList(); renderCalendar(); }
        window.onload = renderApp;
    </script>
</body>
</html>
